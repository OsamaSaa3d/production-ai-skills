name: validate-skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill structure, links, and conventions
        run: python3 scripts/lint_skills.py

      - name: Validate eval graders against their fixtures
        run: python3 examples/validate_graders.py

      - name: Validate eval reporting against synthetic manifests
        run: python3 examples/validate_report.py

      # The README's self-metrics are generated from this script, so a broken
      # generator is a README that quietly goes stale.
      - name: Report project stats
        run: python3 scripts/stats.py

      - name: Syntax-check the installer
        run: sh -n scripts/install.sh
